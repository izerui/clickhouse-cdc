# 本地端到端测试配置：在工程根目录执行 java -jar target/clickhouse-cdc.jar --config e2e/application.properties
source.hostname=127.0.0.1
source.port=3306
source.username=cdc
source.password=Cdc_Test#2026
source.databases=cdc_test
# 需与本机 MySQL 时区一致（SELECT @@global.time_zone, @@system_time_zone;）
source.server-time-zone=Asia/Shanghai
source.server-id=5400-5401

startup.mode=initial

clickhouse.url=http://127.0.0.1:8123
clickhouse.username=default
clickhouse.password=

sink.batch.interval-ms=1000

job.name=e2e-cdc
job.parallelism=2
# 打开 Flink Web UI 便于观察：http://localhost:8081
job.web-ui.port=8081
health.port=8080

# checkpoint 间隔调短，DDL 屏障与续传的效果更快可见
checkpoint.dir=./e2e/data/checkpoints
checkpoint.interval-ms=10000
