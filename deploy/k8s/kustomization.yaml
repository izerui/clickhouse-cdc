# 部署（需要 kubectl >= 1.27，内置 kustomize v5）：
#   1. 先创建密码 Secret，见 secret.example.yaml
#   2. kubectl apply -k deploy/k8s
# 修改 application.properties 后重新 apply，ConfigMap 名称带内容哈希，会自动滚动重启 Pod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace: data-sync

labels:
  - pairs:
      app.kubernetes.io/name: clickhouse-cdc
    includeSelectors: true

# Secret 不在此列，见 secret.example.yaml
resources:
  - service.yaml
  - statefulset.yaml

configMapGenerator:
  - name: clickhouse-cdc-config
    files:
      - application.properties

images:
  - name: clickhouse-cdc
    # 镜像由 GitHub Actions 推送到 ghcr.io/izerui/clickhouse-cdc，经 Harbor 的 ghcr 代理项目拉取
    newName: registry.bstllm.com/ghcr/izerui/clickhouse-cdc
    newTag: latest
