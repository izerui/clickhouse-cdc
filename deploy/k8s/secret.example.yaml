# 数据库密码示例。不在 kustomization.yaml 的资源中，避免每次 apply 用示例值覆盖真实密码。
# 推荐直接创建（只需一次）：
#   kubectl create secret generic clickhouse-cdc-secret \
#     --from-literal=MYSQL_PASSWORD='***' --from-literal=CLICKHOUSE_PASSWORD='***'
# 或修改本文件后单独执行：kubectl apply -f deploy/k8s/secret.example.yaml
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-cdc-secret
type: Opaque
stringData:
  MYSQL_PASSWORD: change-me
  CLICKHOUSE_PASSWORD: ""
