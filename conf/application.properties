# =====================================================================
# MySQL -> ClickHouse CDC 同步配置
# 配置值支持 ${环境变量} 或 ${环境变量:默认值}；命令行 --key=value 可覆盖任意配置项
# =====================================================================

# ------------------------------ MySQL 源 ------------------------------
source.hostname=127.0.0.1
source.port=3306
source.username=root
source.password=${MYSQL_PASSWORD:}
# 要同步的库，逗号分隔
source.databases=demo
# 只同步指定的表（逗号分隔）：表名，或 库名.表名；配置后 source.tables.include 不再生效，例如: t_user,t_order
source.tables=
# 表名包含 / 排除规则（Java 正则，只匹配表名，不能含逗号，多个规则用 | 连接）
source.tables.include=.*
source.tables.exclude=
# MySQL 服务端时区（影响 TIMESTAMP 解析与 ClickHouse DateTime64 列时区），默认本机时区
source.server-time-zone=Asia/Shanghai
# server-id 区间，大小需 >= job.parallelism；不填则每次启动随机生成
source.server-id=
# 全量阶段每个分片的行数、每次拉取行数。auto：按堆内存、并行度和源表平均行长自动计算（最大 8096 / 1024）
source.split-size=auto
source.fetch-size=auto
source.connection-pool-size=20
source.connect-timeout-seconds=30
# 透传 Debezium 参数示例：
# source.debezium.snapshot.locking.mode=none

# ------------------------------ 启动模式 ------------------------------
# initial  : 全量 + 增量（默认）
# latest   : 从最新 binlog 开始增量
# earliest : 从最早 binlog 开始增量
# timestamp: 从指定时间开始增量，需配置 startup.timestamp-millis
# 注意：存在 checkpoint 时总是从 checkpoint 续传，忽略此配置（使用 --fresh 重新开始）
startup.mode=initial
startup.timestamp-millis=

# ------------------------------ ClickHouse 目标 ------------------------------
# HTTP 接口地址（默认端口 8123，HTTPS 为 8443）
clickhouse.url=http://127.0.0.1:8123
clickhouse.username=default
clickhouse.password=${CLICKHOUSE_PASSWORD:}
# ClickHouse 中的库名、表名与 MySQL 完全一致，不支持改名
# 建表时的分区表达式，默认不分区（ReplacingMergeTree 只在分区内去重，请按主键稳定的列分区）
clickhouse.partition-by=
# 建表时追加的 SETTINGS，例如: index_granularity=8192
clickhouse.table-settings=
clickhouse.socket-timeout-ms=300000
# 写入时是否 gzip 压缩请求体
clickhouse.compress=true

# ------------------------------ 写入 ------------------------------
# 每张表攒够多少行或多长时间写一次
sink.batch.size=50000
sink.batch.interval-ms=2000
# 单表缓冲超过该字节数也会立即写出。auto：所有缓冲合计上限的 1/4，1MB ~ 64MB
sink.batch.max-bytes=auto
# 所有表缓冲合计的上限（各写入实例平分），超过时全部写出。auto：可用堆内存的 1/5，8MB ~ 512MB
sink.buffer.max-total-bytes=auto
sink.max-retries=5
# 全新全量同步（initial 且无 checkpoint）前清空目标表
# 不建议关闭：全量数据版本号为 0，若目标表残留旧的增量数据（版本号更大），会覆盖新的全量结果
sink.truncate-before-snapshot=true
# 源端 TRUNCATE / DROP TABLE / 删除列 时是否同步到目标端
sink.truncate-table-enabled=true
sink.drop-table-enabled=false
sink.drop-column-enabled=true
# 目标端执行 DDL 失败时是否忽略（默认失败即报错重启）
sink.ignore-ddl-errors=false

# ------------------------------ 作业 ------------------------------
job.name=mysql-to-clickhouse-cdc
# 并行度（全量阶段并行读取的分片数）。auto：min(4, CPU 核数, 可用堆内存 / 128MB)，且不超过 server-id 区间大小
job.parallelism=auto
# Flink Web UI 端口，0 为不开启
job.web-ui.port=0
# 健康检查端口（/healthz、/readyz、/status），0 为不开启；K8s 部署时开启
health.port=0
# 重启策略：exponential-delay（默认，无限次重试，间隔从 delay-ms 指数增长到 max-delay-ms）
#          fixed-delay（重试 attempts 次后进程以退出码 1 结束）
job.restart.strategy=exponential-delay
job.restart.delay-ms=10000
job.restart.max-delay-ms=300000
job.restart.attempts=10

# ------------------------------ Checkpoint ------------------------------
checkpoint.dir=./data/checkpoints
checkpoint.interval-ms=60000
checkpoint.timeout-ms=600000
checkpoint.retained=3
